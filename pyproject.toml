[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.2.0"
description = "A personal job-application pipeline: scan ATS boards, score, tailor, and apply with an autonomy dial you control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "reportlab>=5.0",
]

[project.optional-dependencies]
# Auto-submit form filling. After installing, also run: playwright install chromium
browser = ["playwright>=1.44"]
# Optional Anthropic SDK for Claude cover letters + grounded answers.
# OpenAI/Codex-compatible calls use the core requests dependency.
llm = ["anthropic>=0.40"]
# Slack button approvals via Socket Mode.
slack = ["slack-bolt>=1.22"]
# Everything.
all = ["playwright>=1.44", "anthropic>=0.40", "slack-bolt>=1.22"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools.packages.find]
include = ["jobagent*"]
